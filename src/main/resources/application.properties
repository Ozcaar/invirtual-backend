# ===============================
# Application
# ===============================
spring.application.name=invirtual
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ===============================
# Datasource
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invirtual}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:https://jooaptsldvtinckgvwhx.supabase.co/auth/v1}

# Non-empty legacy databases must be audited and baselined explicitly; Flyway's
# safe default is to stop rather than assume an existing schema matches V1.
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop

# ===============================
# Security / JWT
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# Payments / Stripe
# ===============================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

stripe.checkout.secret-key=${STRIPE_SECRET_KEY:}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/success}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/cancel}
stripe.checkout.environment=${STRIPE_ENVIRONMENT:TEST}
stripe.checkout.default-currency=${STRIPE_DEFAULT_CURRENCY:MXN}

# ===============================
# Debug (local only)
# ===============================
# debug=true
