# ===============================
# Application
# ===============================
spring.application.name=invirtual
spring.profiles.active=dev
app.frontend-url=${FRONTEND_URL}

# ===============================
# Datasource
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
oauth2.datasource.url=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop

# ===============================
# Security / JWT
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# Payments / Stripe
# ===============================
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

stripe.checkout.secret-key=${STRIPE_SECRET_KEY}
stripe.checkout.success-url=${STRIPE_SUCCESS_URL}
stripe.checkout.cancel-url=${STRIPE_CANCEL_URL}
stripe.checkout.environment=TEST
stripe.checkout.default-currency=MXN

# ===============================
# Debug (local only)
# ===============================
# debug=true
